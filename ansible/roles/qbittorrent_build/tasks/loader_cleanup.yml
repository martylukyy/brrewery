---
# Undo the host-wide library installs made by older brrewery releases. They put
# the vendored Qt (via /etc/ld.so.conf.d/brrewery-vendored.conf) and the vendored
# OpenSSL and zlib (installed into <prefix>/lib, which is already on the
# distro's default loader path) ahead of the distro's own copies for every
# program on the host. Desktop sessions then mixed Qt versions — KDE Plasma
# loaded brrewery's QtCore next to the distro's QtGui and froze. qbittorrent-nox
# now finds Qt and OpenSSL through its run path and links zlib statically, so
# this only removes.
#
# Runs before the build (tasks/main.yml), so stale headers, pkg-config files and
# CMake package configs in <prefix> cannot leak into it, and on removal
# (playbooks/apps/qbittorrent/remove.yml). On hosts that still have these files
# the vendored Qt is rebuilt anyway (resolve.yml), and the system libz.so.1 /
# libssl.so.3 stand in for the removed copies until the new build is in place.

# Older qbittorrent_build and rtorrent_build releases both wrote this file
# (the vendored Qt lib dir plus <prefix>/lib); neither does any more.
# /usr/local/lib is on the loader path via the distro's own
# /etc/ld.so.conf.d/libc.conf anyway.
- name: Remove brrewery's host-wide loader path entry
  ansible.builtin.file:
    path: /etc/ld.so.conf.d/brrewery-vendored.conf
    state: absent
  register: qbt_loader_conf_cleanup

# The shared zlib carries its full version in the file name (libz.so.1.3.2).
- name: Find shared zlib that older releases installed into the shared prefix
  ansible.builtin.find:
    paths: "{{ qbittorrent_prefix }}/lib"
    patterns: "libz.so*"
    file_type: any
  register: qbt_old_zlib_shared

- name: Remove OpenSSL and zlib that older releases installed into the shared prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      (qbt_old_zlib_shared.files | map(attribute='path') | list)
      + ([
        'lib/libssl.so',
        'lib/libssl.so.3',
        'lib/libssl.a',
        'lib/libcrypto.so',
        'lib/libcrypto.so.3',
        'lib/libcrypto.a',
        'lib/pkgconfig/libssl.pc',
        'lib/pkgconfig/libcrypto.pc',
        'lib/pkgconfig/openssl.pc',
        'lib/cmake/OpenSSL',
        'lib/engines-3',
        'lib/ossl-modules',
        'include/openssl',
        'ssl',
        'bin/openssl',
        'bin/c_rehash',
        'lib/libz.a',
        'lib/pkgconfig/zlib.pc',
        'lib/cmake/zlib',
        'include/zlib.h',
        'include/zconf.h',
        'share/man/man3/zlib.3',
        'share/doc/zlib',
      ] | map('regex_replace', '^', qbittorrent_prefix ~ '/') | list)
    }}
  register: qbt_old_libs_cleanup

- name: Refresh the dynamic linker cache
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: true
  when: qbt_loader_conf_cleanup is changed or qbt_old_libs_cleanup is changed
