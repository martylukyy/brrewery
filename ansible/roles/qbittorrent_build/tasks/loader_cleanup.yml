---
# Undo the host-wide library registrations made by older brrewery releases.
# They put the vendored Qt (via /etc/ld.so.conf.d/brrewery-vendored.conf) and the
# vendored OpenSSL (installed into <prefix>/lib, which is already on the distro's
# default loader path) ahead of the distro's own copies for every program on the
# host. Desktop sessions then mixed Qt versions — KDE Plasma loaded brrewery's
# QtCore next to the distro's QtGui and froze. qbittorrent-nox now finds both
# through its run path (Qt in <prefix>/qt<major>, OpenSSL in
# qbittorrent_openssl_prefix), so this only removes.
#
# Runs after a successful build (tasks/main.yml), so a failed rebuild never
# leaves the installed binary without its libraries, and on removal
# (playbooks/apps/qbittorrent/remove.yml).

# rtorrent_build writes the same file with only <prefix>/lib, so drop just the
# Qt lines instead of the whole file.
- name: Remove vendored Qt from the host-wide loader path
  ansible.builtin.lineinfile:
    path: /etc/ld.so.conf.d/brrewery-vendored.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^{{ qbittorrent_prefix }}/qt[0-9]+/lib$'
    - '^# Managed by brrewery — vendored Qt'
  register: qbt_loader_conf_cleanup

- name: Remove OpenSSL that older releases installed into the shared prefix
  ansible.builtin.file:
    path: "{{ qbittorrent_prefix }}/{{ item }}"
    state: absent
  loop:
    - lib/libssl.so
    - lib/libssl.so.3
    - lib/libssl.a
    - lib/libcrypto.so
    - lib/libcrypto.so.3
    - lib/libcrypto.a
    - lib/pkgconfig/libssl.pc
    - lib/pkgconfig/libcrypto.pc
    - lib/pkgconfig/openssl.pc
    - lib/cmake/OpenSSL
    - lib/engines-3
    - lib/ossl-modules
    - include/openssl
    - ssl
    - bin/openssl
    - bin/c_rehash
  register: qbt_old_openssl_cleanup

- name: Refresh the dynamic linker cache
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: true
  when: qbt_loader_conf_cleanup is changed or qbt_old_openssl_cleanup is changed
