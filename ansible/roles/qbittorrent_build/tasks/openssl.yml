---
# A previous failed run can leave a partially-configured tree behind (the build
# root is only cleaned on success). The staging step below is guarded by
# `creates:`, so a leftover source tree would cause it to be skipped on retry,
# leaving a half-configured OpenSSL tree in place. Reset just the openssl
# scratch subtree so every run stages and configures from a clean slate. The
# sibling qbittorrent/zlib/libtorrent build trees under the same root are
# untouched.
- name: Reset the OpenSSL scratch source tree
  ansible.builtin.file:
    path: "{{ qbittorrent_build_root }}/openssl"
    state: absent

- name: Stage OpenSSL source into the build root
  ansible.builtin.command:
    cmd: cp -a "{{ qbittorrent_vendor_root }}/sources/openssl/{{ qbt_openssl }}" "{{ qbittorrent_build_root }}/openssl"
  args:
    creates: "{{ qbittorrent_build_root }}/openssl"

# OpenSSL is installed into its own prefix (qbittorrent_openssl_prefix), off the
# host-wide loader path, so it never replaces the distro libssl/libcrypto for
# other programs. --libdir=lib keeps the libraries (and pkgconfig) in <prefix>/lib
# instead of OpenSSL's default lib64 on x86_64; the run paths baked into Qt and
# qbittorrent-nox, and PKG_CONFIG_PATH, all point at <prefix>/lib. The -rpath
# lets libssl find its own libcrypto without any loader configuration.
- name: Configure vendored OpenSSL 3.x (shared)
  ansible.builtin.command:
    cmd: >-
      ./Configure linux-x86_64
      --prefix={{ qbittorrent_openssl_prefix }}
      --openssldir={{ qbittorrent_openssl_prefix }}/ssl
      --libdir=lib
      shared
      -Wl,-rpath,{{ qbittorrent_openssl_prefix }}/lib
    chdir: "{{ qbittorrent_build_root }}/openssl"
    creates: "{{ qbittorrent_build_root }}/openssl/Makefile"
  environment:
    CFLAGS: "{{ qbt_compiler_flags }}"

- name: Build vendored OpenSSL
  ansible.builtin.command:
    cmd: make -j{{ qbittorrent_build_jobs }}
    chdir: "{{ qbittorrent_build_root }}/openssl"
    creates: "{{ qbittorrent_build_root }}/openssl/libssl.so"

# No `creates:` guard: the prefix path is unversioned, so a previously
# installed libssl would satisfy it and a manifest version bump would build the
# new libs but never install them. Re-running the install copy is cheap.
# `make install_sw` also installs the openssl(1) CLI into <prefix>/bin, which is
# not on PATH, so the distro's openssl stays authoritative.
- name: Install vendored OpenSSL (libraries and headers)
  ansible.builtin.command:
    cmd: make install_sw
    chdir: "{{ qbittorrent_build_root }}/openssl"
  changed_when: true

# `make install_sw` does not populate the trust store, so <openssldir>/certs is
# empty and qBittorrent's certificate verification (e.g. HTTPS trackers via
# libtorrent) fails with "unable to get local issuer certificate". Symlink the
# trust store to the system CA bundle.
- name: Ensure vendored OpenSSL trust-store directory exists
  ansible.builtin.file:
    path: "{{ qbittorrent_openssl_prefix }}/ssl"
    state: directory
    mode: "0755"

- name: Point vendored OpenSSL at the system CA trust store
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
    follow: false
  loop:
    - { src: /etc/ssl/certs, dest: "{{ qbittorrent_openssl_prefix }}/ssl/certs" }
    - { src: /etc/ssl/certs/ca-certificates.crt, dest: "{{ qbittorrent_openssl_prefix }}/ssl/cert.pem" }
  loop_control:
    label: "{{ item.dest }}"
