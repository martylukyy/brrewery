---
- hosts: localhost
  connection: local
  become: true
  gather_facts: true
  roles:
    # The build role rebuilds the venv for the selected line's resolved version.
    # brrewery passes deluge_version/deluge_release/libtorrent_branch as for install.
    - brrewery_user
    - deluge_build
  tasks:
    - name: Look up brrewery user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ brrewery_user }}"
      register: brrewery_passwd

    - name: Set Deluge home fact
      ansible.builtin.set_fact:
        deluge_home: "{{ brrewery_passwd.ansible_facts.getent_passwd[brrewery_user][4] }}"

    # The venv and symlink paths are fixed, but the unit *contents* are rendered
    # per line: the 1.3 line needs the legacy LD_LIBRARY_PATH and has no
    # deluge-web foreground flag, while the 2.x lines need neither the loader
    # path nor a daemonizing deluge-web (dz_web_fg=-d). Re-render the units here
    # so a cross-line upgrade does not leave the previous line's units in place —
    # without this, 1.3 -> 2.x leaves deluge-web without -d, so it forks, the
    # main process exits 0, and systemd tears the unit down as a clean exit.
    - name: Re-render Deluge systemd template units for the new line
      ansible.builtin.include_role:
        name: deluge_build
        tasks_from: service_unit.yml

    # Deliberately does not touch ~/.config/deluge so torrents/settings survive.
    - name: Restart Deluge services after rebuild
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
      loop:
        - "deluged@{{ brrewery_user }}.service"
        - "deluge-web@{{ brrewery_user }}.service"

    - name: Wait for the Deluge daemon RPC port to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ deluge_daemon_port }}"
        timeout: 60

    - name: Wait for the Deluge WebUI to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ deluge_web_port }}"
        timeout: 60
