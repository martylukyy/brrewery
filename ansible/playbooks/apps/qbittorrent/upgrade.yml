---
- hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    qbittorrent_webui_port: 8086
    qbittorrent_bin: /usr/local/bin/qbittorrent-nox
  roles:
    - brrewery_user
    - qbittorrent_build
  tasks:
    # Older units set LD_LIBRARY_PATH to the shared /usr/local/lib, which wins
    # over the binary's run path; re-render the unit without it.
    - name: Update qBittorrent systemd template unit
      ansible.builtin.include_role:
        name: qbittorrent_build
        tasks_from: service_unit.yml

    - name: Restart qBittorrent for brrewery user after rebuild
      ansible.builtin.systemd:
        name: "qbittorrent@{{ brrewery_user }}.service"
        state: restarted
        daemon_reload: true

    - name: Ensure nginx reverse proxy for qBittorrent is configured
      ansible.builtin.include_role:
        name: brrewery_nginx_site
      vars:
        brrewery_app_id: qbittorrent
        brrewery_app_web_path: /qbittorrent/
        brrewery_app_upstream: http://127.0.0.1:{{ qbittorrent_webui_port }}
        brrewery_app_strip_path_prefix: true
